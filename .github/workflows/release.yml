name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example 0.2.0)"
        required: true
        type: string
      prerelease:
        description: "Create as a prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $VERSION"
            echo "Use semantic versioning, for example 0.2.0 or 1.0.0-beta.1"
            exit 1
          fi

          if [ "${VERSION#v}" != "$VERSION" ]; then
            echo "Enter the version without the leading v."
            exit 1
          fi

      - name: Ensure release tag does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists."
            exit 1
          fi

      - name: Update package version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("package.json")
          data = json.loads(path.read_text())
          data["version"] = os.environ["VERSION"]
          path.write_text(json.dumps(data, indent=2) + "\n")
          PY

      - name: Commit version bump
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add package.json

          if git diff --cached --quiet; then
            echo "package.json already contains version $VERSION; no commit needed."
          else
            git commit -m "Release $VERSION"
            git push
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          gh release create "v$VERSION" \
            --target "$(git rev-parse HEAD)" \
            --title "Discounts Card (Kaufland Fix) v$VERSION" \
            --generate-notes \
            $([ "$PRERELEASE" = "true" ] && echo "--prerelease")
