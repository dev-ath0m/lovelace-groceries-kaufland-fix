name: Sync upstream discounts-card

# Keeps main up to date with schblondie/discounts-card while preserving the
# local Kaufland fix (src/utils.js + src/card.js) via a normal git merge.
# Runs weekly, plus on-demand via the Actions tab.

on:
  schedule:
    - cron: "0 4 * * 1" # every Monday 04:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/schblondie/discounts-card.git
          git fetch upstream main

      - name: Merge upstream/main into main
        id: merge
        run: |
          if git merge upstream/main --no-edit; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            git merge --abort
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.merge.outputs.conflict == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        if: steps.merge.outputs.conflict == 'false'
        run: npm ci

      - name: Rebuild card.js
        if: steps.merge.outputs.conflict == 'false'
        run: npm run build

      - name: Commit rebuilt card.js if changed
        if: steps.merge.outputs.conflict == 'false'
        run: |
          git add card.js
          git diff --cached --quiet || git commit -m "chore: rebuild card.js after upstream sync"

      - name: Push changes
        if: steps.merge.outputs.conflict == 'false'
        run: git push origin main

      - name: Open issue on merge conflict
        if: steps.merge.outputs.conflict == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Upstream sync failed: merge conflict (${new Date().toISOString().slice(0, 10)})`,
              body: [
                "The weekly automatic sync from schblondie/discounts-card could not merge",
                "cleanly into `main` and was aborted.",
                "",
                "Please merge `upstream/main` manually, resolve the conflict (likely in",
                "`src/utils.js` or `src/card.js` where the Kaufland detection was added),",
                "run `npm run build`, and push.",
              ].join("\n"),
              labels: ["upstream-sync"],
            });
